<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Equipment Lending{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#5d6b7c; --line:#dde2e8;
          --accent:#2457d6; --ok:#157347; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181e; --card:#1d232c; --ink:#e7ebf0; --muted:#9aa7b6; --line:#2d3641;
            --accent:#7aa2ff; --ok:#5fd08f; --err:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line); }
  nav { max-width:960px; margin:0 auto; padding:12px 16px; display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  nav strong { margin-right:auto; }
  a { color:var(--accent); }
  main { max-width:960px; margin:0 auto; padding:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  h1 { font-size:1.4rem; margin:.2rem 0 1rem; } h2 { font-size:1.1rem; margin:0 0 .75rem; }
  form.inline { display:flex; flex-wrap:wrap; gap:12px; align-items:end; }
  label { display:flex; flex-direction:column; font-size:.85rem; color:var(--muted); gap:4px; }
  input, select, textarea { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:6px;
          background:var(--bg); color:var(--ink); min-width:0; }
  button, .btn { font:inherit; padding:7px 14px; border-radius:6px; border:1px solid var(--accent);
          background:var(--accent); color:#fff; cursor:pointer; text-decoration:none; display:inline-block; }
  button.secondary, .btn.secondary { background:transparent; color:var(--accent); }
  button.danger { background:transparent; color:var(--err); border-color:var(--err); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  td.actions { display:flex; gap:8px; flex-wrap:wrap; }
  td.actions form { margin:0; }
  .flash { padding:10px 14px; border-radius:8px; margin-bottom:12px; border:1px solid; }
  .flash.ok { color:var(--ok); border-color:var(--ok); } .flash.error { color:var(--err); border-color:var(--err); }
  .muted { color:var(--muted); } .tag { font-size:.8rem; padding:2px 8px; border-radius:99px; border:1px solid var(--line); }
  .tag.active { color:var(--ok); border-color:var(--ok); } .tag.cancelled { color:var(--muted); }
  @media (max-width:600px) { th:nth-child(1), td:nth-child(1) { display:none; } }
</style>
</head>
<body>
<header><nav>
  <strong>Equipment Lending</strong>
  <a href="{{ url_for('web.equipment_page') }}">Equipment</a>
  <a href="{{ url_for('web.loans_page') }}">Loans</a>
  <a href="{{ url_for('api.docs') }}">API docs</a>
</nav></header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}" role="{{ 'alert' if cat == 'error' else 'status' }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
