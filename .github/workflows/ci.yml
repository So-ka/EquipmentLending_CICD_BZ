name: CI

# Build the application, run the unit tests, and build + smoke-test the Docker image.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Byte-compile the application (build check)
        run: python -m compileall -q app lending.py wsgi.py

      - name: Run unit tests
        run: python -m pytest --junitxml=junit.xml

      # Results visible on the run page: a summary table + downloadable XML.
      - name: Publish test summary
        if: always()
        run: python scripts/junit_summary.py junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: junit.xml

  docker:
    name: Docker image build & smoke test
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

      - name: Build the image and run the tests inside it
        run: |
          docker build --target test -t equipment-lending:test .
          docker run --rm equipment-lending:test

      - name: Start the stack with Docker Compose (builds the runtime image)
        run: docker compose up --build -d --wait

      - name: Smoke test over HTTP
        run: python3 scripts/smoke.py http://localhost:8000 write

      - name: Restart the stack and check the data persisted in the volume
        run: |
          docker compose down
          docker compose up -d --wait
          python3 scripts/smoke.py http://localhost:8000 read

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs web

      - name: Summary
        if: always()
        run: |
          {
            echo "### Docker"
            docker image ls equipment-lending --format '- `{{.Repository}}:{{.Tag}}` — {{.Size}}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down
        if: always()
        run: docker compose down -v
